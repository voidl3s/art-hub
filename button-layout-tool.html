<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Layout Tool</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f4f5f8; color: #111; }
    .page { max-width: 1220px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 2vw, 2.2rem); }
    p { margin: 8px 0 20px; color: #4c566a; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls { display: grid; gap: 12px; margin-bottom: 18px; }
    .button-group { display: flex; flex-wrap: wrap; gap: 10px; }
    button, input, select { font: inherit; }
    button { border: 1px solid #c1c7d0; background: #fff; color: #111; padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: all 0.16s ease; }
    button:hover { border-color: #7f8fa4; background: #fafbfc; }
    button.active { background: #2e86ff; border-color: #2e86ff; color: white; }
    input[type=number], select { width: 120px; padding: 10px 12px; border-radius: 10px; border: 1px solid #c1c7d0; background: white; }
    .preview-shell { position: relative; border: 1px solid #dfe3ea; border-radius: 18px; overflow: hidden; background: white; width: 100%; max-width: 1200px; margin-bottom: 18px; }
    .preview-toolbar { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 0; }
    .preview-label { font-size: 0.95rem; color: #4c566a; }
    #previewFrame { width: 100%; height: 640px; border: 0; display: block; pointer-events: none; }
    #buttonMarker { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 60, 80, 0.16); border: 2px solid rgba(255,60,80,0.85); transform: translate(-50%, -50%); display: grid; place-items: center; color: #991b1b; font-weight: 700; cursor: grab; user-select: none; }
    #buttonMarker.dragging { cursor: grabbing; }
    .button-group button.button-active { background: #2e86ff; border-color: #2e86ff; color: white; }
    .panel { display: grid; gap: 14px; padding: 16px; background: #fff; border: 1px solid #dfe3ea; border-radius: 18px; }
    .panel h2 { margin: 0; font-size: 1.1rem; }
    textarea { width: 100%; min-height: 180px; padding: 14px; border-radius: 14px; border: 1px solid #c1c7d0; background: #fcfdff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.92rem; color: #1f2937; resize: vertical; }
    .meta { color: #6b7280; font-size: 0.95rem; }
    @media (max-width: 840px) { .preview-shell { max-width: 100%; } }
  </style>
</head>
<body>
  <main class="page">
    <h1>Button Layout Tool</h1>
    <p>Drag the red handle to place the animated button for each screen size. Use the export panel to copy the final CSS or download it.</p>

    <section class="panel controls">
      <div class="button-group" role="group" aria-label="Device presets">
        <button type="button" data-device="mobile" class="active">Mobile</button>
        <button type="button" data-device="tablet">Tablet</button>
        <button type="button" data-device="desktop">Desktop</button>
      </div>
      <div class="button-group" role="group" aria-label="Button selection">
        <button type="button" data-button="music" class="button-active">Audio Works</button>
        <button type="button" data-button="digital">Digital Art</button>
        <button type="button" data-button="home">HOME</button>
        <button type="button" data-button="3d">3D Works</button>
      </div>
      <div class="row">
        <label class="preview-label" for="deviceWidth">Width</label>
        <input id="deviceWidth" type="number" min="320" max="1920" step="1">
        <label class="preview-label" for="deviceHeight">Height</label>
        <input id="deviceHeight" type="number" min="400" max="1400" step="1">
        <button id="btnResize" type="button">Resize Preview</button>
        <span id="currentDevice" class="meta"></span>
      </div>
      <div class="row">
        <button id="btnReset" type="button">Reset to defaults</button>
        <button id="btnClear" type="button">Clear saved positions</button>
      </div>
    </section>

    <section class="preview-shell" id="previewShell">
      <iframe id="previewFrame" src="index.html" title="Site preview"></iframe>
      <div id="buttonMarker" role="button" aria-label="Drag to position the action button">BUTTON</div>
    </section>

    <section class="panel">
      <div class="preview-toolbar">
        <button id="btnCopyCss" type="button">Copy CSS</button>
        <button id="btnDownloadCss" type="button">Download CSS</button>
        <span id="savedState" class="meta"></span>
      </div>
      <textarea id="cssOutput" readonly aria-label="Generated CSS output"></textarea>
    </section>
  </main>

  <script>
    const presets = {
      mobile: { width: 360, height: 800, query: '@media (max-width: 719px)' },
      tablet: { width: 768, height: 1024, query: '@media (min-width: 720px) and (max-width: 1099px)' },
      desktop: { width: 1366, height: 768, query: '@media (min-width: 1100px)' },
    };

    const storageKey = 'buttonLayoutPositions';
    const buttons = {
      music: { label: 'Audio Works', href: 'music.html' },
      digital: { label: 'Digital Art', href: 'digital-art.html' },
      home: { label: 'HOME', href: 'index.html' },
      '3d': { label: '3D Works', href: '3d-models.html' },
    };
    const defaultPositions = Object.fromEntries(Object.keys(buttons).map(key => [key, {
      mobile: { left: 50, top: 85 },
      tablet: { left: 50, top: 85 },
      desktop: { left: 50, top: 85 },
    }]));

    const frame = document.getElementById('previewFrame');
    const shell = document.getElementById('previewShell');
    const marker = document.getElementById('buttonMarker');
    const widthInput = document.getElementById('deviceWidth');
    const heightInput = document.getElementById('deviceHeight');
    const currentDeviceText = document.getElementById('currentDevice');
    const cssOutput = document.getElementById('cssOutput');
    const savedState = document.getElementById('savedState');

    let currentDevice = 'mobile';
    let currentButton = 'music';
    let dragging = false;
    let positions = loadPositions();

    function loadPositions() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        return { ...defaultPositions, ...saved };
      } catch (error) {
        return { ...defaultPositions };
      }
    }

    function savePositions() {
      localStorage.setItem(storageKey, JSON.stringify(positions));
      savedState.textContent = 'Saved positions in localStorage.';
      setTimeout(() => { savedState.textContent = ''; }, 1800);
    }

    function applyDevice(device) {
      currentDevice = device;
      const preset = presets[device];
      shell.style.width = preset.width + 'px';
      shell.style.height = preset.height + 'px';
      frame.style.width = '100%';
      frame.style.height = '100%';
      widthInput.value = preset.width;
      heightInput.value = preset.height;
      document.querySelectorAll('[data-device]').forEach(btn => btn.classList.toggle('active', btn.dataset.device === device));
      setMarkerPosition();
      updateOutput();
      currentDeviceText.textContent = `${device} (${preset.width}×${preset.height})`;
    }

    function applyButton(button) {
      currentButton = button;
      document.querySelectorAll('[data-button]').forEach(btn => btn.classList.toggle('button-active', btn.dataset.button === button));
      setMarkerPosition();
      updateOutput();
      marker.textContent = buttons[button].label;
    }

    function setMarkerPosition() {
      const { left, top } = positions[currentButton][currentDevice] || defaultPositions[currentButton][currentDevice];
      marker.style.left = left + '%';
      marker.style.top = top + '%';
    }

    function updateOutput() {
      const css = generateCss();
      cssOutput.value = css;
    }

    function generateCss() {
      const deviceBlocks = ['mobile', 'tablet', 'desktop'];
      const lines = [];
      lines.push('#mainButtonContainer {');
      lines.push('  position: fixed;');
      lines.push('  top: 50%;');
      lines.push('  left: 50%;');
      lines.push('  transform: translate(-50%, -50%);');
      lines.push('}');
      lines.push('');

      Object.entries(buttons).forEach(([key, info]) => {
        const mobile = positions[key].mobile || defaultPositions[key].mobile;
        lines.push(`#mainButtonContainer .hover-button[data-href="${info.href}"] {`);
        lines.push('  position: absolute;');
        lines.push(`  top: ${mobile.top}%;`);
        lines.push(`  left: ${mobile.left}%;`);
        lines.push('  transform: translate(-50%, -50%);');
        lines.push('}');
        lines.push('');
      });

      lines.push(`${presets.tablet.query} {`);
      Object.entries(buttons).forEach(([key, info]) => {
        const tablet = positions[key].tablet || defaultPositions[key].tablet;
        lines.push(`  #mainButtonContainer .hover-button[data-href="${info.href}"] {`);
        lines.push(`    top: ${tablet.top}%;`);
        lines.push(`    left: ${tablet.left}%;`);
        lines.push('  }');
      });
      lines.push('}');
      lines.push('');

      lines.push(`${presets.desktop.query} {`);
      Object.entries(buttons).forEach(([key, info]) => {
        const desktop = positions[key].desktop || defaultPositions[key].desktop;
        lines.push(`  #mainButtonContainer .hover-button[data-href="${info.href}"] {`);
        lines.push(`    top: ${desktop.top}%;`);
        lines.push(`    left: ${desktop.left}%;`);
        lines.push('  }');
      });
      lines.push('}');

      return lines.join('\n');
    }

    function updatePositionFromPointer(event) {
      const rect = shell.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const left = Math.round((x / rect.width) * 100);
      const top = Math.round((y / rect.height) * 100);
      positions[currentButton][currentDevice] = {
        left: Math.min(100, Math.max(0, left)),
        top: Math.min(100, Math.max(0, top)),
      };
      setMarkerPosition();
      updateOutput();
    }

    marker.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      dragging = true;
      marker.classList.add('dragging');
      marker.setPointerCapture(event.pointerId);
    });

    marker.addEventListener('pointerup', (event) => {
      if (!dragging) return;
      dragging = false;
      marker.classList.remove('dragging');
      savePositions();
      marker.releasePointerCapture(event.pointerId);
    });

    shell.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      updatePositionFromPointer(event);
    });

    shell.addEventListener('pointerleave', () => {
      if (dragging) {
        dragging = false;
        marker.classList.remove('dragging');
        savePositions();
      }
    });

    document.querySelectorAll('[data-device]').forEach(button => {
      button.addEventListener('click', () => applyDevice(button.dataset.device));
    });

    document.querySelectorAll('[data-button]').forEach(button => {
      button.addEventListener('click', () => applyButton(button.dataset.button));
    });

    document.getElementById('btnResize').addEventListener('click', () => {
      const width = Number(widthInput.value);
      const height = Number(heightInput.value);
      if (width >= 320 && height >= 300) {
        shell.style.width = width + 'px';
        shell.style.height = height + 'px';
        updateOutput();
      }
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      positions = { ...defaultPositions };
      savePositions();
      setMarkerPosition();
      updateOutput();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      localStorage.removeItem(storageKey);
      positions = { ...defaultPositions };
      applyDevice(currentDevice);
      updateOutput();
    });

    document.getElementById('btnCopyCss').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(cssOutput.value);
        savedState.textContent = 'CSS copied to clipboard.';
        setTimeout(() => savedState.textContent = '', 1500);
      } catch (err) {
        savedState.textContent = 'Copy failed. Use manual selection.';
      }
    });

    document.getElementById('btnDownloadCss').addEventListener('click', () => {
      const blob = new Blob([cssOutput.value], { type: 'text/css' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'button-positions.css';
      anchor.click();
      URL.revokeObjectURL(url);
    });

    marker.textContent = buttons[currentButton].label;
    applyDevice(currentDevice);
    updateOutput();
  </script>
</body>
</html>
