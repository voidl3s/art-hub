<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Digital Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<script>
let zIndexCounter = 6000;

document.querySelectorAll(".retro-click").forEach(img => {
  img.addEventListener("click", () => {
    createWindow(img.src);
  });
});

function createWindow(imageSrc) {

  const win = document.createElement("div");
  win.classList.add("window");
  win.style.top = Math.random() * 200 + 100 + "px";
  win.style.left = Math.random() * 200 + 100 + "px";
  win.style.zIndex = zIndexCounter++;

  win.innerHTML = `
    <div class="window-header">
      <span>Image Viewer</span>
      <div class="window-close">×</div>
    </div>
    <div class="window-content">
      <img src="${imageSrc}">
    </div>
  `;

  document.body.appendChild(win);

  // Bring to front when clicked
  win.addEventListener("mousedown", () => {
    win.style.zIndex = zIndexCounter++;
  });

  // Close button
  win.querySelector(".window-close").addEventListener("click", () => {
    win.remove();
  });

  makeDraggable(win);
}

function makeDraggable(win) {
  const header = win.querySelector(".window-header");

  let offsetX = 0;
  let offsetY = 0;
  let isDragging = false;

  header.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    win.style.left = e.clientX - offsetX + "px";
    win.style.top = e.clientY - offsetY + "px";
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;
  });
}
</script>
<body>

<div class="grid-background"></div>

<div class="page">

  <header class="top-bar">
    <div class="logo">DIEGO<br>ULLOA</div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="digital-art.html">Digital</a>
      <a href="music.html">Music</a>
      <a href="3d-models.html">3D</a>
    </nav>
  </header>

  <main class="content">

    <section class="block large">
      <h1>THIS WEEK</h1>
    </section>

    <section class="block">
      <h2>Featured Work</h2>
      <p>Artist Name — 2026</p>
    </section>

    <section class="block image-block">
      <img src="images/art1.jpg" class="retro-click">
    </section>

    <section class="block image-block">
      <img src="images/art1.jpg" class="retro-click">
    </section>

  </main>

</div>

</body>
</html>
